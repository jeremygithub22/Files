<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-primary {
            background-color: #0078d4;
            color: white;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Item List</h1>

    <form id="personForm">

        <div class="form-group">
            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter person name"
                required>
        </div>

        <button
            type="submit"
            class="btn-primary"
            id="saveButton">
            Add Person
        </button>


    </form>

    <div id="message"></div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>

        <tbody id="personTableBody">
        </tbody>

    </table>

</div>

<script>

    const apiUrl = "/api/Person/Items";

    // Load list of when page starts
    document.addEventListener("DOMContentLoaded", loadPersons);

    // load the list of Persons
    async function loadPersons() {

        try {

            const response = await fetch(apiUrl);
        
            if (!response.ok) {
                throw new Error("Unable to retrieve list of persons added.");
            }

            const personList = await response.json();
            
            displayPersons(personList);

        } catch (error) {

            showMessage(error.message);

        }
    }


    // Display Persons
    function displayPersons(personList) {
    
        const tableBody =
            document.getElementById("personTableBody");

        tableBody.innerHTML = "";

        personList.forEach(person => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${person.id}</td>
                <td>${person.name}</td>
            `;

            tableBody.appendChild(row);
    
        });
    }


    // Add a person from the list
    document
        .getElementById("personForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

           let apiUrl = "/api/Person/AddItem";
           let name =  document.getElementById("name").value;
           
            try {

                let response;

                    // CREATE
                    response = await fetch(apiUrl, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(name)

                    });
                
                if (!response.ok) {
                    const error = await response.text()
                    showMessage(error);
                }
                else
                {
                    loadPersons();
                    showMessage("Person created successfully.");
                    clearForm();
                }

            } catch (error) {

                showMessage(error.message);

            }
        });

    // // Clear form
    function clearForm() {

        document.getElementById("personForm").reset();

        document.getElementById("name").value = "";

        document.getElementById("saveButton").textContent =
            "Add Person";

    }

    // // Display message
    function showMessage(message) {
        
        const messageElement =
            document.getElementById("message");

        messageElement.textContent = message;

        setTimeout(() => {

            messageElement.textContent = "";

        }, 3000);
    }

</script>

</body>
</html>
